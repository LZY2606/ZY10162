[package]
name = "han-ceng-nian-chi"
version = "0.1.0"
edition = "2021"
description = "寒层年尺 — 冰芯深度-年代单调曲线本地服务"

[[bin]]
name = "han-ceng-nian-chi"
path = "src/main.rs"

[lib]
name = "hanceng"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"

[profile.release]
panic = "abort"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
